name: Build & Publish Release Archive

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # CI lints and tests the plugin, then builds the archive from the tagged commit and runs the specs against
  # it, so a tag cannot publish a build that fails its checks, and what is published is what was tested.
  ci:
    uses: ./.github/workflows/ci.yml
    with:
      tag: ${{ github.ref_type == 'tag' && github.ref_name || '' }}

  publish-release:
    needs: ci
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download artifact
        uses: actions/download-artifact@v8
        with:
          name: opds_plus.koplugin

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          files: |
            opds_plus.koplugin.zip
            opds_plus.koplugin.zip.sha256
          fail_on_unmatched_files: true
          draft: false
          prerelease: false
